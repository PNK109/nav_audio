<!-- T123: Кинематограф личности — stable course embed -->
<div class="kl-t123-embed" id="kl-t123-embed">
  <iframe
    id="kl-course-frame"
    title="Кинематограф личности — авторский курс Егора Панковского"
    src="https://raw.githack.com/PNK109/nav_audio/course-geocities-performance-v1/index.html"
    loading="eager"
    scrolling="no"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>
</div>

<style>
  #record2497332653,
  .kl-t123-embed {
    width: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    overflow-anchor: none;
    contain: paint;
    background: #b9def4;
    line-height: 0;
  }

  .kl-t123-embed iframe {
    display: block;
    width: 100%;
    height: 900px;
    margin: 0;
    border: 0;
    overflow: hidden;
    overflow-anchor: none;
    background: #b9def4;
  }
</style>

<script>
(function () {
  var duplicateEmbeds = document.querySelectorAll(".kl-t123-embed");
  for (var i = 1; i < duplicateEmbeds.length; i++) duplicateEmbeds[i].remove();

  if (window.__klCourseEmbedInitialized) return;
  window.__klCourseEmbedInitialized = true;

  var frame = document.getElementById("kl-course-frame");
  if (!frame) return;

  var courseOrigin = "https://raw.githack.com";
  var viewportFrame = 0;
  var heightTimer = 0;
  var resizeTimer = 0;
  var pendingHeight = 0;
  var appliedHeight = 0;

  function sendViewport() {
    viewportFrame = 0;
    if (!frame.contentWindow) return;

    var rect = frame.getBoundingClientRect();
    var visible = rect.bottom > 0 && rect.top < window.innerHeight;
    var top = visible ? Math.max(0, -rect.top) : 0;
    var bottom = visible
      ? Math.min(frame.offsetHeight, window.innerHeight - rect.top)
      : 0;

    frame.contentWindow.postMessage({
      source: "tilda-kl",
      type: "viewport",
      top: top,
      bottom: bottom,
      height: window.innerHeight,
      visible: visible
    }, courseOrigin);
  }

  function scheduleViewport() {
    if (viewportFrame) return;
    viewportFrame = requestAnimationFrame(sendViewport);
  }

  function applyStableHeight() {
    heightTimer = 0;
    if (Math.abs(pendingHeight - appliedHeight) < 3) return;

    appliedHeight = pendingHeight;
    frame.style.height = appliedHeight + "px";
    scheduleViewport();
  }

  function scheduleHeight(height) {
    pendingHeight = height;
    window.clearTimeout(heightTimer);
    heightTimer = window.setTimeout(applyStableHeight, 70);
  }

  function scrollToCoursePoint(top) {
    var frameTop = frame.getBoundingClientRect().top + window.scrollY;
    var targetTop = Math.max(0, Math.round(frameTop + top - 16));
    window.scrollTo(0, targetTop);
    scheduleViewport();
  }

  function handleCourseMessage(event) {
    if (event.origin !== courseOrigin || event.source !== frame.contentWindow) return;

    var data = event.data;
    if (!data || data.source !== "pankovskii-kl") return;

    if (data.type === "resize") {
      var height = Math.ceil(Number(data.height));
      if (Number.isFinite(height) && height >= 600 && height <= 50000) {
        scheduleHeight(height);
      }
      return;
    }

    if (data.type === "scroll-to") {
      var top = Number(data.top);
      if (Number.isFinite(top) && top >= 0 && top <= 50000) {
        scrollToCoursePoint(top);
      }
    }
  }

  function requestCourseHeight() {
    if (!frame.contentWindow) return;
    frame.contentWindow.postMessage({
      source: "tilda-kl",
      type: "request-size"
    }, courseOrigin);
    scheduleViewport();
  }

  window.addEventListener("message", handleCourseMessage);
  window.addEventListener("scroll", scheduleViewport, { passive: true });
  window.addEventListener("resize", function () {
    window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(requestCourseHeight, 90);
  }, { passive: true });
  frame.addEventListener("load", requestCourseHeight);

  requestCourseHeight();
  scheduleViewport();
  window.setTimeout(requestCourseHeight, 450);
  window.setTimeout(requestCourseHeight, 1500);
})();
</script>
