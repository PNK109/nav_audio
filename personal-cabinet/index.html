<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171713">
  <title>НАВЬ // Личный архив</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="cabinet" aria-label="Персональная картотека НАВЬ">
    <div class="utility">
      <div class="utility__brand">НАВЬ // PRIVATE INDEX // USER_0109</div>
      <div class="role-switch" role="group" aria-label="Демонстрация прав доступа">
        <span>ROLE</span>
        <button type="button" data-role="student" aria-pressed="true">СТУДЕНТ</button>
        <button type="button" data-role="user" aria-pressed="false">ПОЛЬЗОВАТЕЛЬ</button>
      </div>
    </div>

    <section class="deck" id="deck" aria-label="Папки личного архива"></section>
    <div class="hint">НАЖАТЬ НА ПАПКУ // ESC — ЗАКРЫТЬ</div>
  </main>

  <script src="app.js"></script>
</body>
</html>
